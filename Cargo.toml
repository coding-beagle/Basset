[workspace]
resolver = "3"
members = [
    "crates/basset-math",
    "crates/basset-sketch",
    "crates/basset-kernel",
    "crates/basset-core",
    "crates/basset-io",
    "crates/basset-viewport",
    "crates/basset-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/basset670/basset670"

[workspace.dependencies]
basset-math = { path = "crates/basset-math" }
basset-sketch = { path = "crates/basset-sketch" }
basset-kernel = { path = "crates/basset-kernel" }
basset-core = { path = "crates/basset-core" }
basset-io = { path = "crates/basset-io" }
basset-viewport = { path = "crates/basset-viewport" }

glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
slotmap = { version = "1.1", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
approx = "0.5"
earcutr = "0.5"
ttf-parser = "0.25"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
pollster = "1"
rfd = "0.17"
anyhow = "1"

# A CAD kernel spends its life in tight numeric loops; unoptimised debug builds make the
# viewport unusable, so dependencies are always optimised and our own code gets a modest boost.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
